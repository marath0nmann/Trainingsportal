name: Deploy to all-inkl.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Wenn der FTP-User auf das Subdomain-Verzeichnis gechrootet ist: "/"
          # Sonst (FTP-User sieht das gesamte Webspace-Root): "/training.tus-oedt.de/"
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/*.zip
            **/build.sh
            **/commit.sh
            **/CHANGELOG.md
            **/CLAUDE.md
            **/README.md
            **/COMMIT_EDITMSG
            **/sql/**

      - name: Clear OPcache
        run: curl --fail --retry 3 --retry-delay 5 -v https://training.tus-oedt.de/opcache-clear.php
